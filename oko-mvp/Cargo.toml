[package]
name = "oko-core"
version = "0.2.0"
edition = "2021"

# ỌKỌ core and host. The dependency policy is an allowlist, not a ban: the
# terminal core and PTY are the only Cargo dependencies, and Servo is a
# prebuilt engine process rather than a linked library. Everything else is
# std, so the core still builds and tests offline (SRD §2, AT-019).
#
# Servo is the only browser engine this project ships. It is located under
# `third_party/engines/servo/` and started as its own process; a missing
# binary is reported as unavailable, never replaced by another engine
# (SRD ENG-001, ENG-002, ENG-008). `mock` is a dev stub for tests only.

[[bin]]
name = "oko-host"
path = "src/main.rs"

# Slice 4: a real terminal core (SRD §7.1, TERM-004). Hand-rolling a VT parser
# is the swamp the ecosystem already drained, so the two maintained crates come
# in behind the port traits the architecture already defines. This is the first
# exception to the zero-dependency rule, and it is recorded in
# toolchain/versions.lock and docs/adr/0001.
[dependencies]
# Alacritty's UI-independent terminal core: VTE parser, cell grid, scrollback.
alacritty_terminal = "0.26"
# wezterm's PTY crate: the real adapter behind TerminalPort.
portable-pty = "0.8"
# Platform bindings for the framebuffer presenter (ioctl/mmap). A platform API
# binding, not a framework: no runtime, no background state.
libc = "0.2"

[dev-dependencies]

[[test]]
name = "domain_command_test"
path = "tests/domain/command_test.rs"

[[test]]
name = "application_command_service_test"
path = "tests/application/command_service_test.rs"

[[test]]
name = "at001_clean_architecture"
path = "tests/acceptance/at001_clean_architecture.rs"

[[test]]
name = "at002_terminal_operation"
path = "tests/acceptance/at002_terminal_operation.rs"

[[test]]
name = "at019_offline_core_tests"
path = "tests/acceptance/at019_offline_core_tests.rs"

[[test]]
name = "at008_engine_lifecycle"
path = "tests/acceptance/at008_engine_lifecycle.rs"

[[test]]
name = "at009_engine_compatibility"
path = "tests/acceptance/at009_engine_compatibility.rs"

[[test]]
name = "at005_host_api_capability_enforcement"
path = "tests/acceptance/at005_host_api_capability_enforcement.rs"

[[test]]
name = "meta_line_budget"
path = "tests/meta/line_budget.rs"

