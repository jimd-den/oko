[package]
name = "oko-core"
version = "0.2.0"
edition = "2021"

# Slice 1 MVP: headless core + terminal. Zero external dependencies so the
# core builds and tests offline (SRD AT-001, AT-019). Platform adapters use
# std only; a real PTY/nix integration is a later adapter swap behind the
# same port trait.
#
# Slice 2: web-based desktop. Adds the Blink/V8/Skia browser engine adapter
# behind the `blink` feature flag. Per SRD §2.1 / §5.1, Blink is NOT embedded
# as a standalone library; it is provided through a supported Chromium
# embedding arrangement. The Chromium source tree must be built separately
# (approved upstream build process, pinned revision, verified checksum) and
# linked via the adapter's embedder-interface declarations below.
#
# Default (no features): the core builds offline with zero external crates and
# can serve the `mock` dev engine. Which engine serves is chosen by name at
# startup (`--engine <name>`, else the profile's `[browser] engine`); a name
# this build does not contain is reported as unavailable rather than replaced
# by another engine (SRD ENG-002, ENG-008).
# --features blink:  includes the blink adapter declarations (still requires
#                    a separately built Chromium embedder to link).
# --features servo:  includes the servo adapter declarations (still requires
#                    a separately built Servo checkout to link).

[[bin]]
name = "oko-host"
path = "src/main.rs"

[dependencies]

[features]
default = []
blink = []
servo = []

[dev-dependencies]

[[test]]
name = "domain_command_test"
path = "tests/domain/command_test.rs"

[[test]]
name = "application_command_service_test"
path = "tests/application/command_service_test.rs"

[[test]]
name = "at001_clean_architecture"
path = "tests/acceptance/at001_clean_architecture.rs"

[[test]]
name = "at002_terminal_operation"
path = "tests/acceptance/at002_terminal_operation.rs"

[[test]]
name = "at019_offline_core_tests"
path = "tests/acceptance/at019_offline_core_tests.rs"

[[test]]
name = "at008_engine_lifecycle"
path = "tests/acceptance/at008_engine_lifecycle.rs"

[[test]]
name = "at009_engine_compatibility"
path = "tests/acceptance/at009_engine_compatibility.rs"

[[test]]
name = "at005_host_api_capability_enforcement"
path = "tests/acceptance/at005_host_api_capability_enforcement.rs"

[[test]]
name = "meta_line_budget"
path = "tests/meta/line_budget.rs"

