# ỌKỌ dependency version lock (SRD §14.1, §14.2)
# Every shipped upstream component records: component, upstream project,
# exact release tag/revision, source URL, checksum, license, build config,
# transitive inventory, advisory tracking, local patches, update owner.
#
# DEP-001: No unpinned upstream revisions in release builds.
# DEP-002: No silent dependency downloads during compilation (install is an
# explicit terminal command, never a build-time download).
#
# Browser engines: Servo is the only one this project ships. There is no
# Blink/V8/Skia entry because no Chromium stack is built or bundled; the
# minimal production set is one engine per build (SRD ENG-001, DEP-012).

# Graphics backends (enabled explicitly per target platform — DEP-007)
[vulkan]
component = "Vulkan-Headers / Vulkan-Loader"
upstream_project = "KhronosGroup"
role = "Primary accelerated graphics backend (Linux initial)"
source_url = "https://github.com/KhronosGroup/Vulkan-Host-Loader.git"
pinned_revision = "sdk-1.3.239.0"
license = "Apache-2.0"
target_platforms = ["linux-x86-64", "windows"]

[direct3d]
component = "Direct3D 11 / Direct3D 12 headers"
upstream_project = "Microsoft"
role = "Required Windows graphics backends"
target_platforms = ["windows"]
license = "MIT / MS-RL (Windows SDK)"

# Prebuilt engine release (SRD §2.1, §5.2). Servo publishes ready-to-run
# archives, so the engine is fetched and unpacked rather than built from source:
# the digest below is the published one for this exact asset. The adapter keeps
# marking it experimental, because upstream calls it that, not because another
# engine is hiding behind it.
[servo]
component = "Servo"
upstream_project = "Servo"
role = "The only browser engine this project ships, driven as a separate process"
source_url = "https://github.com/servo/servo/releases/download/v0.7.0/servo-aarch64-linux-gnu.tar.gz"
pinned_revision = "v0.7.0"
source_checksum_sha256 = "034f66ec113fcf7ced0534cba2899b6bc578402309ad4bddb69e5803587f5513"
archive_kind = "tar.gz"
license = "MPL-2.0"
build_configuration = "prebuilt release archive"
target_platforms = ["linux-aarch64"]
security_advisory_tracking = "Servo security advisories"
local_patches = []
patch_rationale = "none"
update_owner = "platform-team"
rollback_procedure = "Remove third_party/engines/servo and revert versions.lock to the previous revision"

# Terminal core (ADR 0001, issue #5). First exception to the zero-dependency
# rule: recorded here with exact versions per DEP-001, and the reason per ADR.
[alacritty_terminal]
component = "alacritty_terminal"
upstream_project = "Alacritty"
role = "UI-independent terminal core: VTE parser, cell grid, scrollback"
version = "0.26.0"
license = "Apache-2.0"
pinned_by = "Cargo.lock"
why = "Hand-rolling a VT parser is the swamp the ecosystem already drained (ADR 0001)"

[portable_pty]
component = "portable-pty"
upstream_project = "wezterm"
role = "Real PTY sessions behind TerminalPort"
version = "0.8.0"
license = "MIT"
pinned_by = "Cargo.lock"
why = "The planned adapter swap behind the existing port trait (ADR 0001)"
