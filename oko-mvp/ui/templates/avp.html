<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="oko-token" content="__OKO_HOST_TOKEN__">
<title>MU/TH/UR 6000</title>
<style>
  :root { --green:#5dff9b; --dim:#1d5c33; --bg:#020a04; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--green);
               font-family: ui-monospace, "Courier New", monospace; font-size: 14px; overflow: hidden; }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px); }
  main { height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; gap: 10px; padding: 18px; }
  .brand { display: flex; justify-content: space-between; letter-spacing: .22em;
           text-transform: uppercase; border-bottom: 1px solid var(--dim); padding-bottom: 6px; }
  .brand small { color: var(--dim); letter-spacing: .1em; }
  #boot { min-height: 6.5em; color: var(--dim); white-space: pre-wrap; line-height: 1.5; }
  #boot b { color: var(--green); font-weight: 400; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-height: 0; }
  .panel { border: 1px solid var(--dim); padding: 8px; min-height: 0; overflow: auto; }
  .panel h2 { color: var(--dim); font-size: 11px; letter-spacing: .2em; margin-bottom: 6px; }
  .row { display: flex; justify-content: space-between; font-size: 13px; }
  .k { color: var(--dim); }
  #log { height: 8em; overflow: auto; border-top: 1px solid var(--dim); padding-top: 6px; }
  #log .you::before { content: "> "; color: var(--dim); }
  #log .it { color: var(--green); } #log .err { color: #ff5d5d; }
  form { display: flex; gap: 8px; border-top: 1px solid var(--dim); padding-top: 6px; }
  input { flex: 1; background: transparent; border: none; color: var(--green);
          font-family: inherit; font-size: 14px; caret-color: var(--green); }
  input:focus { outline: none; }
  label { color: var(--dim); }
  canvas { width: 100%; height: 90px; display: block; }
</style>
</head>
<body>
  <main>
    <div class="brand"><span>WEYLAND-YUTANI · MU/TH/UR 6000</span><span id="clock">--:--:--</span></div>
    <div id="boot" aria-live="polite"></div>
    <div class="grid">
      <section class="panel"><h2>SYSTEM STATUS</h2>
        <div class="row"><span class="k">CORE</span><span id="core">…</span></div>
        <div class="row"><span class="k">ENGINE</span><span id="engine">…</span></div>
        <div class="row"><span class="k">UPTIME</span><span id="uptime">…</span></div>
        <div class="row"><span class="k">INTERFACE</span><span id="iface">…</span></div>
        <canvas id="scan" width="320" height="90"></canvas>
      </section>
      <section class="panel"><h2>INTERFACE 2037</h2>
        <div class="row"><span class="k">LINK</span><span id="link">READY</span></div>
        <div class="row"><span class="k">SESSION</span><span id="session">…</span></div>
        <div class="row"><span class="k">CAPABILITY</span><span id="caps">…</span></div>
        <div class="row"><span class="k">404</span><span id="err">NO ERROR</span></div>
      </section>
    </div>
    <div id="log" aria-live="polite"></div>
    <form id="ask"><label for="text">&gt;</label><input id="text" autocomplete="off" aria-label="Command" autofocus /></form>
  </main>
  <script src="../scripts/host-api.js"></script>
  <script>
    const call = window.Oko.hostCall, el = (id) => document.getElementById(id);
    const boot = [
      "MU/TH/UR 6000  ·  BOOT SEQUENCE",
      "INTERFACE 2037 READY FOR INQUIRY",
      "WEYLAND-YUTANI CORP · BUILD 2179",
      ""
    ];
    let line = 0;
    function tick() {
      if (line < boot.length) {
        el('boot').textContent += boot[line] + "\n";
        line++;
        setTimeout(tick, 260);
      } else {
        el('boot').innerHTML += "<b>READY.</b>";
      }
    }
    function say(kind, text) {
      const d = document.createElement('div'); d.className = kind; d.textContent = text;
      el('log').appendChild(d); el('log').scrollTop = el('log').scrollHeight;
    }
    async function status() {
      try {
        const s = await call('host.status');
        el('core').textContent = s.core.toUpperCase();
        el('iface').textContent = s.ui.toUpperCase();
        const e = await call('host.browser.engine');
        el('engine').textContent = (e.engine + ' ' + e.version).toUpperCase();
        const caps = await call('host.browser.capabilities');
        el('caps').textContent = (caps.capabilities || []).join(' ').toUpperCase() || 'NONE';
      } catch (err) { el('core').textContent = 'OFFLINE'; el('err').textContent = err.message; }
    }
    el('ask').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const text = el('text').value.trim(); el('text').value = '';
      if (!text) return;
      say('you', text);
      try {
        const a = await call('computer.ask', { text });
        say('it', a.reply);
        if (a.session_id) el('session').textContent = a.session_id.toUpperCase();
      } catch (err) { say('err', err.message); }
    });
    const c = el('scan'), ctx = c.getContext('2d'); let y = 0;
    function scan() {
      ctx.fillStyle = 'rgba(2,10,4,.35)'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.fillStyle = '#5dff9b'; ctx.fillRect(0, y, c.width, 1);
      for (let i = 0; i < 24; i++) {
        const h = 6 + ((i * 37 + y) % 60);
        ctx.fillStyle = 'rgba(93,255,155,.5)';
        ctx.fillRect(8 + i * 13, c.height - h, 8, h);
      }
      y = (y + 1) % c.height;
    }
    const start = Date.now();
    setInterval(() => {
      el('clock').textContent = new Date().toLocaleTimeString();
      const s = Math.floor((Date.now() - start) / 1000);
      el('uptime').textContent = Math.floor(s / 60) + 'M ' + (s % 60) + 'S';
    }, 1000);
    setInterval(scan, 50); setInterval(status, 2000);
    tick(); status(); scan();
  </script>
</body>
</html>
