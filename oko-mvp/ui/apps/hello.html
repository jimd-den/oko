<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ỌKỌ · custom UI</title>
<style>
  :root { --accent: #4da6ff; }
  html, body { margin: 0; height: 100%; background: #0d0d0d; color: #e8e8e8;
               font-family: ui-monospace, Menlo, monospace; font-size: 14px; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 10px; }
  #time { font-size: 40px; color: var(--accent); letter-spacing: 0.06em; }
  #count { color: #8a8a8a; }
  button { background: transparent; border: 1px solid #2a2a2a; color: #e8e8e8;
           padding: 6px 14px; font-family: inherit; cursor: pointer; border-radius: 3px; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  p.note { color: #8a8a8a; font-size: 11px; max-width: 30em; text-align: center; }
</style>
</head>
<body>
  <!-- A custom UI: ordinary HTML, CSS and JavaScript, loaded into a web pane
       beside the terminal. It is its own document, so it cannot reach the
       host API unless the pane grants it (SRD §10.2 zone B vs zone C). -->
  <main>
    <div id="time">--:--:--</div>
    <div id="count">pressed 0 times</div>
    <button id="press">press me</button>
    <p class="note">a custom UI in a web pane · the terminal beside it is a real
      PTY session in the host</p>
  </main>
  <script>
    let pressed = 0;
    document.getElementById('press').addEventListener('click', () => {
      pressed += 1;
      document.getElementById('count').textContent = 'pressed ' + pressed + ' times';
    });
    setInterval(() => {
      document.getElementById('time').textContent = new Date().toLocaleTimeString();
    }, 1000);
  </script>
</body>
</html>
