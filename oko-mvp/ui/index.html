<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ỌKỌ — Terminal-First Desktop</title>
<link rel="stylesheet" href="styles/themes/dark.css">
<link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div id="desktop" role="desktop" aria-label="ỌKỌ workspace">
    <!-- Top bar: system status, launcher, clock -->
    <header id="top-bar" role="menubar" aria-label="System menu">
      <div class="brand" id="brand">ỌKỌ</div>
      <div class="status" id="status" aria-live="polite">core: ready</div>
      <div class="spacer"></div>
      <div id="clock" aria-label="Current time">--:--:--</div>
      <button id="btn-launcher" aria-label="Open application launcher">Apps</button>
      <button id="btn-settings" aria-label="Open settings">Settings</button>
    </header>

    <!-- Split workspace: terminal panel + browser panel -->
    <div id="workspace" role="region" aria-label="Workspace">
      <!-- Terminal panel -->
      <section id="panel-terminal" class="panel" aria-label="Terminal">
        <div class="panel-header">
          <span class="panel-title">Terminal</span>
          <div class="panel-controls">
            <button class="btn-split" aria-label="Split terminal">⟍</button>
            <button class="btn-close" aria-label="Close panel">✕</button>
          </div>
        </div>
        <div class="panel-body">
          <div id="terminal-output" aria-live="polite" class="terminal-output"></div>
          <input id="terminal-input" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Terminal input" />
        </div>
      </section>

      <!-- Resizable splitter -->
      <div id="splitter" role="separator" aria-orientation="vertical" aria-valuenow="50" aria-label="Resize panels"></div>

      <!-- Browser panel -->
      <section id="panel-browser" class="panel" aria-label="Browser">
        <div class="panel-header">
          <span class="panel-title">Browser</span>
          <div class="panel-controls">
            <button class="btn-refresh" aria-label="Refresh">⟳</button>
            <button class="btn-close" aria-label="Close panel">✕</button>
          </div>
        </div>
        <div class="panel-body">
          <div id="browser-view" class="browser-view" aria-label="Browser content">
            <div class="browser-placeholder">
              <p>Browser engine: <span id="browser-engine">loading…</span></p>
              <p id="browser-status">Connecting to host…</p>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- Status bar -->
    <footer id="status-bar" role="status" aria-live="polite">
      <span id="cap-status">caps: none</span>
      <span id="engine-status">engine: mock</span>
    </footer>
  </div>

  <script src="scripts/main.js"></script>
</body>
</html>
